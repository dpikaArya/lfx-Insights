[project]
name = "consilium"
version = "0.8.0"
description = "Research strategy & authoring copilot layered on Perspicacité"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Louis-Félix Nothias" }, { name = "HolobiomicsLab" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "click>=8.1",
    "structlog>=24.0",
    "tenacity>=9.0",
    "httpx>=0.27",
    "litellm>=1.60",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "sentence-transformers>=3.0",
    "scipy>=1.12",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.4",
    "pytest-httpx>=0.30",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.12",
    "pre-commit>=3.8",
]
# Holobiomics standards stack — claims/evidence (indicium), insights/provenance
# (ASTRA), agentic task cards/capsules (asb-schema). Editable local siblings; see
# [tool.uv.sources]. Without this extra, the standards/ exporters degrade with a
# clear "install with `uv sync --extra standards`" message and validation tests skip.
standards = [
    "indicium>=1.12",
    "astra-spec",
    "asb-schema",
]
# Expose Consilium's capabilities as an MCP server (`consilium serve`), so other
# agents can consume it the way Consilium consumes Perspicacité. Without this extra
# the `serve` command exits with a clear install hint.
mcp = [
    "fastmcp>=3.0",
]
docs = [
    "mkdocs-material>=9.5",
]
# Grounded .docx export — python-docx is optional so the core install stays lean.
# Imported lazily inside reporting/docx_export.py (guarded with a clear install hint).
docx = [
    "python-docx>=1.1",
]

[project.scripts]
consilium = "consilium.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/consilium"]

[tool.uv.sources]
# Standards-stack deps resolve WITHOUT local sibling checkouts so a fresh `git clone` +
# `uv sync` works for any collaborator:
#  - astra-spec: published on PyPI (no source entry needed); it has no git repo, so it must
#    not be cloned.
#  - indicium (>=1.12) and asb-schema: not on PyPI, so they resolve from their HolobiomicsLab
#    git repos — uv clones them automatically (needs GitHub access to the org). asb-schema
#    lives in a subdirectory of the AgenticScienceBuilder repo. uv.lock pins the exact commits.
indicium = { git = "https://github.com/HolobiomicsLab/indicium.git" }
asb-schema = { git = "https://github.com/HolobiomicsLab/AgenticScienceBuilder.git", subdirectory = "asb-schema" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: Unit tests (no external services)",
    "integration: Integration tests (wired with fakes)",
    "e2e: End-to-end pipeline tests (mocked LLM + fake backend)",
    "live: Tests requiring a running Perspicacité + real LLM (deselect with -m 'not live')",
    "slow: Slow tests, opt-in or excluded in fast runs",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "E501", "F401", "F841", "TC001", "TC002", "TC003"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# FastMCP's @mcp.tool() decorator is untyped; allow it for the MCP server module.
module = "consilium.mcp.server"
disallow_untyped_decorators = false

[tool.coverage.run]
source = ["src/consilium"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 85
