name: Docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install Python
        run: uv python install 3.12
      # --frozen: install from uv.lock without re-resolving, so the editable
      # standards siblings (absent in CI) are not built. See ci.yml for details.
      - name: Sync (docs)
        run: uv sync --frozen --extra docs
      # --no-sync: use the env from the Sync step; a plain `uv run` re-resolves
      # and tries to build the absent editable standards siblings.
      - name: Build site (strict)
        run: uv run --no-sync mkdocs build --strict
